services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-2022
    hostname: sql-server-2022
    ports:
      - "1433:1433"
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD en .env}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - sql_data:/var/opt/mssql
      - ./database/backups:/var/opt/mssql/backup
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  sql_data:
    driver: local
  ollama_data:
    name: deployment_ollama_data
