version: '3.9'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-2022
    hostname: sql-server-2022
    ports:
      - "1433:1433"
    environment:
      MSSQL_SA_PASSWORD: "P@ssw0rd123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - sql_data:/var/opt/mssql
      - ./database/backups:/var/opt/mssql/backup
    restart: unless-stopped

volumes:
  sql_data:
    driver: local
